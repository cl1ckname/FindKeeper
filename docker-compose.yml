services:
  wireguard:
    image: registery.toadonload.ru/find-keeper-wg:latest
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
    restart: unless-stopped

  bot:
    image: registery.toadonload.ru/find-keeper:latest
    network_mode: service:wireguard
    depends_on:
      - wireguard
    env_file:
      - .env
    restart: unless-stopped
