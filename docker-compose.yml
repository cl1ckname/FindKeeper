version: "3.8"
services:
  telegram-bot:
    build: .
    container_name: telegram-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ENVIRONMENT=production
    # network_mode: host  # если нужен доступ к локальным сервисам
    # или обычная сеть
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
