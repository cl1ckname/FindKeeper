name: Deploy Go App
on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: make docker-build
      - name: Push
        run: make docker-push
